<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<title>Home</title>
	<link rel="stylesheet"
		href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
		integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
		crossorigin="anonymous">
	<meta name="_csrf" th:content="${_csrf.token}"/>
	<meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
    <h1>Home</h1>
    <div class="container">
		<h2>Welcome: <span th:text="${currentUser}"></h2>
	</div>
	<hr/>

		<nav class="navbar navbar-expand-lg">
			<ul class="navbar-nav me-auto mb-2 mb-lg-0">
				<li class="nav-item">
					<a class="nav-link" href="/cart">Cart</a>
				</li>
				<li class="nav-item">
					<a class="nav-link">WishList</a>
				</li>
			</ul>
		</nav>

	<div class="container">
		<input id="productSearch" class="form-control" type="text" placeHolder="Search" onkeyup="searchFilter()"> 
		<select name="productOption" class="form-control" id="dropDownList">
    		<option value="0">select option</option>
   		 	<option th:each="product : ${products}" th:value="${product.id}" th:text="${product.productName} + ' ___ ' + ${product.price}"></option>
		</select>
		
	</div>
	<div class="container" id="cardContainer" style="display:none" >
		<div class="card" style="width:18 rem;">
			<img class="card-img-top" id="cardImg" src="">
			<div class="card-body">
				<h5 class="card-title" id="cardTitle"></h5>
				<p class="card-text" id="cardBodyText"></p>
			</div>
			<div class="container">
				<div class="row">
					<div class="col-6">
						<button id="addToCart" class="btn add-to-cart">Add to Cart</button>
						<span id="cartBadge">0</span> 
					</div>
					<div class="col-6">
						<button id="addToWishList" class="btn add-to-wishlist">Add to WishList</button> 
					</div>
					
				</div>
				
			</div>
			
			
		</div>
	</div>
	<script>
		
	const badge = document.getElementById('cartBadge');
	const token = document.querySelector('meta[name="_csrf"').content;
	const header = document.querySelector('meta[name="_csrf_header"]').content;
	const addButton = document.getElementById('addToCart');
	const title = document.getElementById('cardTitle');
	let text = document.getElementById('cardBodyText');
	const img = document.getElementById('cardImg');
	
	
	document.addEventListener('click', async (e) => {
	
		if(!e.target.matches('.add-to-cart')) return;
		
		const productId = e.target.dataset.productId;
		alert(productId);
		const res = await fetch('/api/cart/items', {
			method: 'POST',
			headers: {'Content-Type': 'application/json',
			[header]: token},
			body: JSON.stringify({productId, quantity: 1})
		});
		if(!res.ok) return alert('Could not add to cart');
		const s = await res.json();
		alert(JSON.stringify(s));
		badge.textContent = s.itemCount ?? 0;

	});

	var p;
	document.getElementById('dropDownList').addEventListener('change', async (e) => {
		document.getElementById('cardContainer').style.display="";
		const id = e.target.value;
		const res = await fetch(`/api/products/${id}`);
		if(!res.ok) return;
		p = await res.json();
		title.innerText = `${p.productName}`
		text.innerText = `Description: ${p.description}  \n Price: ${p.price}`;
		img.src = `/assets/${p.productImage}`;
		addButton.dataset.productId = id;
	});
	function searchFilter() {
		var inputElement = document.getElementById("productSearch")
		filter = inputElement.value.toUpperCase();
		select = document.getElementById("dropDownList")
		product = select.options;
		for(i = 0; i < product.length; i++) {

			text = product[i].textContent || product[i].innerText
			if(text != "0") {
				if(text.toUpperCase().indexOf(filter) > -1) {
				product[i].style.display = "";
			} else {
				product[i].style.display = "none";
			}
				
			}
		}
	
	
	}
</script>
</body>
</html>
